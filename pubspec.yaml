name: shopdesk_flutter
description: Offline single-computer shop inventory, billing and accounting desktop application.
publish_to: none
version: 0.9.0+13
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqflite_common_ffi: ">=2.3.7 <2.4.0"
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.20.2
  crypto: ^3.0.6
  cryptography: ^2.7.0
  pdf: ^3.11.0
  printing: ^5.14.0
  excel: ^4.0.6
  file_picker: ^10.1.0
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/sbm_logo.png
